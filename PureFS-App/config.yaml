server:
    host: 0.0.0.0
    port: 8080
    external_url: http://localhost:8080
    read_timeout: 30s
    write_timeout: 1m0s
    upload_max_size: 10737418240
database:
    driver: sqlite
    dsn: data/purefs.db?_journal_mode=WAL&_busy_timeout=5000&_synchronous=NORMAL
storage:
    driver: local
    local:
        path: data/storage
    s3:
        endpoint: ""
        region: ""
        bucket: ""
        access_key: ""
        secret_key: ""
        secure: false
auth:
    jwt_secret: change-me-in-production
    jwt_expiry: 24h0m0s
    encryption_key: ""
log:
    level: info
    file: ""
integrity:
    enabled: false
    interval: 168h0m0s
